  ```yaml
  name: CI

  on:
    push:
      branches: [ main ]
    pull_request:
      branches: [ main ]

  jobs:
    build:
      runs-on: ubuntu-latest

      steps:
        - name: Baixa o código do repositório
          uses: actions/checkout@v5

        - name: Instala o Java 17
          uses: actions/setup-java@v5
          with:
            distribution: temurin
            java-version: '17'
            cache: maven

        - name: Dá permissão ao Maven Wrapper
          run: chmod +x mvnw

        - name: Executa os testes
          run: ./mvnw -B clean test

